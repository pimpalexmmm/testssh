name: SOCKS5 Proxy (tmate - No Auth)

on: workflow_dispatch

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: نصب و اجرای SOCKS5 سرور
        run: |
          sudo apt-get update && sudo apt-get install -y python3
          cat > socks5.py << 'EOF'
          import socket, struct, select, threading, socketserver

          class Socks5Handler(socketserver.BaseRequestHandler):
              def handle(self):
                  ver, nm = struct.unpack("!BB", self.connection.recv(2))
                  if ver != 5: return
                  self.connection.recv(nm)
                  self.connection.sendall(struct.pack("!BB", 5, 0))
                  ver, cmd, _, atype = struct.unpack("!BBBB", self.connection.recv(4))
                  if ver != 5 or cmd != 1: return
                  if atype == 1:
                      addr = socket.inet_ntoa(self.connection.recv(4))
                  elif atype == 3:
                      length = ord(self.connection.recv(1))
                      addr = self.connection.recv(length).decode()
                  else: return
                  port = struct.unpack("!H", self.connection.recv(2))[0]
                  try:
                      remote = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      remote.connect((addr, port))
                  except Exception:
                      reply = struct.pack("!BBBBIH", 5, 1, 0, 1, 0, 0)
                      self.connection.sendall(reply)
                      return
                  self.connection.sendall(struct.pack("!BBBB", 5, 0, 0, 1) + b'\x00\x00\x00\x00' + struct.pack("!H", 0))
                  self.connection.settimeout(30)
                  remote.settimeout(30)
                  try:
                      while True:
                          r,_,_ = select.select([self.connection, remote], [], [], 30)
                          if self.connection in r:
                              d = self.connection.recv(4096)
                              if not d: break
                              remote.sendall(d)
                          if remote in r:
                              d = remote.recv(4096)
                              if not d: break
                              self.connection.sendall(d)
                  finally:
                      self.connection.close()
                      remote.close()

          class ThreadedSocks5Server(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True

          server = ThreadedSocks5Server(('0.0.0.0', 1080), Socks5Handler)
          print("[+] SOCKS5 on port 1080")
          server.serve_forever()
          EOF
          python3 socks5.py &

      - name: اتصال tmate بدون محدودیت کاربر
        uses: mxschmitt/action-tmate@v3   # بدون limit-access-to-actor
